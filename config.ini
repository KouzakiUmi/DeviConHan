[main]
# 游戏标识 — Steam App ID（精确匹配）或游戏目录名称（模糊匹配）
# 使用 Steam App ID 可精确快速定位游戏，推荐使用纯数字 ID
# 可通过扫描本机 Steam 库自动获取
GAME_ID = 3054820

# 自动检测模式（尝试在Steam目录中查找游戏）
AUTO_DETECT_GAME = true

# 手动指定的游戏目录（当AUTO_DETECT_GAME=false时使用）
# GAME_PATH = /path/to/game

# 平台特定设置
WINDOWS_EXE = DevilConnection.exe
MACOS_APP = Devil Connection.app
LINUX_BINARY = DevilConnection

FUSE_SENTINEL = dL7pKGdnNz796PbbjQWNKmHXBZaB9tsX
FUSE_WIRE_HEADER_LENGTH = 34
FUSE_ASAR_INTEGRITY_OFFSET = 4
BACKUP_PREFIX = Backup_
PATCH_INFO_FILE = .patch_info
PATCH_META_FILE = .patch_meta
TIME_DIFF_THRESHOLD_DAYS = 730
RESOURCE_DIR = resources
APP_NAME = TyranoV8_Patcher

# Steam 路径（由程序自动检测，通常不需要修改）
# STEAM_WINDOWS = C:\Program Files\Steam\steamapps\common
# STEAM_MACOS = ~/Library/Application Support/Steam/steamapps/common
# STEAM_LINUX = ~/.local/share/Steam/steamapps/common

# 游戏名称变体（用于Steam目录搜索，支持罗马音等变体）
# 逗号或空格分隔多个变体
GAME_NAME_VARIATIONS = devirukonenku, deviru konenku, debilcon, debil con

[files]
CHECK_FILES_FOR_UPDATE = 
    data/others/craftmincho.ttf
    data/others/DZUYOKU.ttf
    data/others/funwari-round.ttf
    data/others/HeadUpDaisy.ttf
    tyrano/lang.js

STABLE_FILES_FOR_VALIDATION = 
    index.html
    main.js
    package.json
    steam.js
    preload.js
    electron_latest.js
