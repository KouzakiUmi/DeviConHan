[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tyrano-patcher"
version = "1.0.0"
description = "A localization tool for TyranoV8-based games (Devil Connection)"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "KouzakiUmi", email = "kouzaki@outlook.com"}
]
maintainers = [
    {name = "KouzakiUmi", email = "kouzaki@outlook.com"}
]
keywords = ["tyrano", "localization", "patcher", "electron"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: Free for non-commercial use",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
    "Topic :: System :: Archiving :: Packaging"
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/KouzakiUmi/DeviConHan"
Repository = "https://github.com/KouzakiUmi/DeviConHan"
Issues = "https://github.com/KouzakiUmi/DeviConHan/issues"
Changelog = "https://github.com/KouzakiUmi/DeviConHan/releases"

[project.scripts]
tyrano-patcher = "main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "gui", "utils", "controllers"]
exclude = ["tests*", "docs*", "tools*"]

[tool.setuptools.package-data]
"" = ["*.ini", "*.ico", "*.md", "*.txt", "*.json", "*.zip"]
"resources" = ["*"]
"gui.tabs" = ["*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["core", "gui", "utils", "controllers"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ttkthemes.*",
    "PIL.*",
    "ctypes.*"
]
ignore_missing_imports = true
