name: Auto Build (Nightly)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Pack.cmd
            Pack.sh
            icon.ico
            config.ini
            main.py
            pyproject.toml
            requirements.txt
            Patch.zip
            core
            gui
            controllers
            utils
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyinstaller asar pillow

      - name: Convert icon for macOS
        if: matrix.os == 'macos-latest'
        run: |
          if [ -f icon.ico ]; then
            python3 -c "from PIL import Image; img = Image.open('icon.ico'); img.save('icon.icns'); print('Converted icon.ico to icon.icns')"
          fi

      - name: Run Windows Pack Script
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: call Pack.cmd

      - name: Run Mac/Linux Pack Script
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x Pack.sh
          ./Pack.sh

      - name: Prepare Artifacts for Release
        shell: bash
        run: |
          mkdir -p release_artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/*.exe release_artifacts/ 2>/dev/null || true
          else
            # Ensure correct extension for macos app bundles vs linux binaries
            if [ "${{ matrix.os }}" = "macos-latest" ]; then
              for app in dist/*.app; do
                if [ -d "$app" ]; then
                  zip -r "release_artifacts/$(basename "$app" .app)_macos.zip" "$app"
                fi
              done
            fi

            # Grab raw binaries if any
            for f in dist/*; do
              if [ -f "$f" ]; then
                cp "$f" "release_artifacts/$(basename "$f")_${{ matrix.os }}"
              fi
            done
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: release_artifacts/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            README.md
          sparse-checkout-cone-mode: false

      - name: Generate Build Info
        id: date
        shell: bash
        run: |
          echo "build_time=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          pattern: build-*
          merge-multiple: true

      - name: Cleanup existing nightly release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up existing nightly release and tag..."
          
          # First, try to get release by tag name
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/nightly" \
            | jq -r '.id')
          
          # If not found by tag, search for releases
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "No release found by tag, searching all releases..."
            RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              | jq -r '.[] | select(.tag_name == "nightly") | .id' | head -1)
          fi
          
          # Delete the release if it exists
          if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing nightly release (ID: $RELEASE_ID)"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Release delete request sent"
          else
            echo "No existing nightly release found"
          fi
          
          # Wait for GitHub to process the deletion
          echo "Waiting for cleanup to complete..."
          sleep 10
          
          # Delete remote tag using multiple methods
          echo "Attempting to delete remote tag..."
          git config --local advice.detachedHead false
          git fetch origin --tags || true
          git push origin --delete nightly 2>&1 || echo "Tag deletion method 1 failed or tag doesn't exist"
          git push origin :refs/tags/nightly 2>&1 || echo "Tag deletion method 2 failed"
          
          # Verify tag is deleted
          sleep 2
          if git ls-remote --tags origin nightly 2>/dev/null | grep -q "nightly"; then
            echo "WARNING: Tag still exists after cleanup attempt"
          else
            echo "Tag successfully deleted or didn't exist"

      - name: Create new nightly tag and release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Delete local tag if exists
          git tag -d nightly 2>/dev/null || echo "No local tag found"
          
          # Create and push new tag
          git tag nightly
          git push origin nightly
          
          echo "New nightly tag created and pushed"

      - name: Release Nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "最新测试补丁 (Nightly) - ${{ steps.date.outputs.build_time }}"
          body: |
            ### 🚧 自动跨平台构建版本
            **构建信息:**
            - 📅 时间: ${{ steps.date.outputs.build_time }} (CST)
            - #️⃣ 提交: ${{ github.sha }}
            - 💻 平台: Windows / macOS / Linux

            **更新日志:**
            ${{ github.event.head_commit.message }}
          files: all_artifacts/*
          prerelease: true
          draft: false
          update: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
