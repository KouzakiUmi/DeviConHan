name: Auto Build (Nightly)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Pack.cmd
            Pack.sh
            icon.ico
            config.ini
            main.py
            pyproject.toml
            requirements.txt
            core
            gui
            controllers
            utils
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyinstaller asar pillow

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            call Pack.cmd
          else
            chmod +x Pack.sh
            ./Pack.sh
          fi

      - name: Prepare Artifacts
        run: |
          mkdir -p release_artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/*.exe release_artifacts/ 2>/dev/null || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            for app in dist/*.app; do
              [ -d "$app" ] && zip -r "release_artifacts/$(basename "$app" .app)_macos.zip" "$app"
            done
          else
            for f in dist/*; do [ -f "$f" ] && cp "$f" "release_artifacts/$(basename "$f")_linux"; done
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: release_artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            README.md
          sparse-checkout-cone-mode: false

      - name: Generate Build Info
        run: echo "build_time=$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          pattern: build-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly - ${{ steps.date.outputs.build_time }}"
          body: |
            ### 自动构建版本
            - 时间: ${{ steps.date.outputs.build_time }} (CST)
            - 提交: ${{ github.sha }}
            - 平台: Windows / macOS / Linux
          files: all_artifacts/*
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
